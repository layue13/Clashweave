// Opt-in integration fixtures. Neither their classes nor assets enter the production jar.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def s = p.sourceSets.create('p0Validation') {
        java.srcDir('tools/p0/java')
        compileClasspath = p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    p.tasks.register('p0ValidationJar', Jar) {
        dependsOn(s.classesTaskName)
        from(s.output)
        archiveFileName.set('p0-validation.jar')
        destinationDirectory.set(p.layout.buildDirectory.dir('p0'))
    }
    p.tasks.register('p0LaunchFiles') {
        dependsOn('p0ValidationJar', 'jar')
        dependsOn { ['runClient', 'runServer'].collectMany { n -> p.tasks.getByName(n).taskDependencies.getDependencies(p.tasks.getByName(n)).toList() } }
        doLast {
            ['runClient', 'runServer'].each { n ->
                def task = p.tasks.getByName(n)
                def output = p.file("build/p0/${n}.json")
                output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    java:task.javaLauncher.get().executablePath.asFile.absolutePath,
                    classpath:task.classpath.asPath, main:task.mainClass.get(), jvmArgs:task.allJvmArgs, args:task.args]))
            }
        }
    }
}
